services:
  db:
    image: postgres:16-alpine
    container_name: ledgeriq-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgeriq_db}
      POSTGRES_USER: ${POSTGRES_USER:-ledgeriq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgeriq_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgeriq_user} -d ${POSTGRES_DB:-ledgeriq_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ledgeriq-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.backend
    container_name: ledgeriq-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-ledgeriq_user}:${POSTGRES_PASSWORD:-ledgeriq_secret_password}@db:5432/${POSTGRES_DB:-ledgeriq_db}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-insecure_dev_secret_key_change_in_production}
      - CORS_ORIGINS=["*"]
    ports:
      - "8000:8000"
    volumes:
      - ../../backend:/app/backend
      - ../../src:/app/src
      - ../../frontend:/app/frontend
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  postgres_data:
    name: ledgeriq_postgres_data
  redis_data:
    name: ledgeriq_redis_data
