[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-module3"
version = "1.0.0"
description = "Autonomous Statutory Statement & Dynamic Notes Compiler (Companies Act 2017 & IFRS)"
readme = "README.md"
authors = [{ name = "Ehtisham", email = "ehtisham@example.com" }]
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.5",
    "pydantic>=2.7.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
fyp-compiler = "fyp_module3.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

